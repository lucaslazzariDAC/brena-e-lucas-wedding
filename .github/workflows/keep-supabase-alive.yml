name: Keep Supabase project alive

# Supabase's free plan auto-pauses a project after ~7 days with no database
# activity. This job makes a tiny read-only request to the project's REST API
# every few days so it never goes quiet long enough to be paused.
#
# Setup (one time): in the GitHub repo, go to
#   Settings -> Secrets and variables -> Actions -> New repository secret
# and add:
#   SUPABASE_URL              -> same value as VITE_SUPABASE_URL in .env
#   SUPABASE_PUBLISHABLE_KEY  -> same value as VITE_SUPABASE_PUBLISHABLE_KEY in .env

on:
  schedule:
    # Every Monday and Thursday at 12:00 UTC (09:00 America/Sao_Paulo) —
    # comfortably inside the 7-day inactivity window, with margin for
    # GitHub sometimes delaying scheduled runs.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY repo secrets." >&2
            exit 1
          fi
          # Chama a função keep_alive(), que faz um UPSERT real no banco
          # (uma leitura simples pode não contar como atividade).
          status=$(curl -sS -X POST -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Unexpected response from Supabase." >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
