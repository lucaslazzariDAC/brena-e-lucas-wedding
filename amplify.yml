version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    # Nitro's aws_amplify preset (set in vite.config.ts) writes the deployable
    # bundle here — both the static assets and the SSR compute handler.
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
